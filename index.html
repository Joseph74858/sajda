<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahma Celebration</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    color: white;

    /* 🌌 Animated background */
    background: linear-gradient(-45deg, #000000, #1a1a40, #2b1055, #000000);
    background-size: 400% 400%;
    animation: bgMove 12s ease infinite;
}

@keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* 🌟 WELCOME */
#welcome {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #ff4e50, #1a2a6c);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

#welcome h1 {
    font-size: 30px;
    text-align: center;
    text-shadow: 0 0 20px white;
}

button {
    position: absolute;
    bottom: 50px;
    padding: 14px 35px;
    font-size: 18px;
    border: none;
    background: gold;
    color: black;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 0 20px gold;
}

/* 🌌 MAIN */
#main {
    display: none;
    position: absolute;
    width: 100%;
    height: 100%;
}

/* CENTER */
.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/* IMAGE */
img {
    width: 260px;
    border-radius: 20px;
    box-shadow: 0 0 30px white;
    animation: fadeLoop 6s ease-in-out infinite;
}

/* NAME */
.name {
    font-size: 30px;
    margin-top: 10px;
    color: gold;
    text-shadow: 0 0 15px gold;
    animation: fadeLoop 6s infinite;
}

/* 📖 BIBLE TEXT (FIXED VISIBILITY) */
.text {
    margin-top: 20px;
    font-size: 22px;
    padding: 10px 20px;

    color: #ffffff;
    background: rgba(0,0,0,0.5);
    border-radius: 10px;

    text-shadow: 0 0 10px cyan, 0 0 20px cyan;
    animation: fadeLoop 6s infinite;
}

/* ANIMATION */
@keyframes fadeLoop {
    0% { opacity: 0; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.1); }
}

/* ✨ SPARKLES */
.sparkle {
    position: absolute;
    color: gold;
    font-size: 18px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<!-- 🌟 WELCOME -->
<div id="welcome">
    <h1>✨ Welcome to Johuntervich Debrobosci Martineal Zone ✨</h1>
    <button onclick="start()">Start 💖</button>
</div>

<!-- 🌌 MAIN -->
<div id="main">
    <div class="container">
        <img src="photo.jpeg">
        <div class="name">Rahma 💖</div>
        <div class="text" id="verse"></div>
    </div>
</div>

<!-- 🎵 MUSIC -->
<audio id="music" src="song.mp3"></audio>

<script>
const verses = [
"Genesis 1:31 – God saw all that He had made, and it was very good ✨",
"Psalm 139:14 – You are fearfully and wonderfully made 💖",
"Jeremiah 29:11 – For I know the plans I have for you 🌸",
"Proverbs 3:5 – Trust in the Lord with all your heart 🌟",
"Numbers 6:24 – The Lord bless you and keep you 🙏"
];

let index = 0;

function changeVerse() {
    document.getElementById("verse").innerText = verses[index];
    index = (index + 1) % verses.length;
}

setInterval(changeVerse, 6000);

function start() {
    document.getElementById("welcome").style.display = "none";
    document.getElementById("main").style.display = "block";

    document.getElementById("music").play();
    changeVerse();
}

/* ✨ Sparkles */
setInterval(() => {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.innerText = "✨";
    s.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6000);
}, 300);
</script>

</body>
</html>
