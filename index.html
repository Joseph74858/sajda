<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Sajda ❤️</title>

<style>
body {
    margin:0;
    padding:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#240046,#5a189a,#9d4edd);
    overflow:hidden;
    color:white;
    text-align:center;
}

.container {
    width:90%;
    max-width:500px;
}

input {
    padding:12px;
    border:none;
    border-radius:30px;
    width:70%;
    text-align:center;
}

button {
    padding:12px 25px;
    border:none;
    border-radius:30px;
    margin-top:15px;
    background:white;
    color:#5a189a;
    font-weight:bold;
    cursor:pointer;
}

#countdown {
    font-size:60px;
    display:none;
}

#surprise {
    display:none;
}

#slideshow {
    width:100%;
    max-height:420px;
    object-fit:cover;
    border-radius:20px;
    margin-top:20px;
    box-shadow:0 0 40px rgba(255,255,255,0.4);
    opacity:0;
    transition:opacity 1.5s ease-in-out;
}

#loveMessage {
    position:absolute;
    bottom:15%;
    width:100%;
    font-size:22px;
    font-weight:bold;
    text-shadow:0 0 20px #fff;
}

@keyframes floatText {
    0% {opacity:0; transform:translateY(40px);}
    20% {opacity:1;}
    80% {opacity:1;}
    100% {opacity:0; transform:translateY(-40px);}
}

.heart {
    position:absolute;
    bottom:-20px;
    animation: floatUp 8s linear infinite;
    opacity:0.8;
}

@keyframes floatUp {
    0% {transform: translateY(0) scale(1);}
    100% {transform: translateY(-100vh) scale(1.5);}
}
</style>
</head>

<body>

<div class="container">

<div id="login">
    <h1>For Sajda ❤️</h1>
    <p><b>Unlock by password:</b> I love you Sajda</p>
    <input type="password" id="password" placeholder="Enter Password">
    <br>
    <button onclick="checkPassword()">Open My Heart</button>
</div>

<div id="countdown"></div>

<div id="surprise">
    <h1>I Am Truly Sorry ❤️</h1>
    <img id="slideshow" src="">
</div>

<audio id="music" src="love.mp3"></audio>

</div>

<div id="loveMessage"></div>

<script>

var totalImages = 40;
var images = [];

// Create array 1-40
for (let i = 1; i <= totalImages; i++) {
    images.push(i);
}

// Shuffle function
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

shuffle(images);

var currentIndex = 0;

var messages = [
"🌸 Happy Women's Day my beautiful queen.",
"💖 Today I celebrate you and the amazing woman you are.",
"✨ You make my world brighter every single day.",
"🌹 Your smile is the most beautiful thing in my life.",
"💎 I'm lucky to have a strong and beautiful woman like you.",
"💞 Being with you is the best gift life gave me.",
"❤️ You are not just my love, you are my inspiration.",
"🌅 Every day with you feels like a blessing.",
"🌸 Your kindness and beauty make my heart melt.",
"💓 I admire your strength and your heart.",
"🌹 You deserve all the love and happiness in this world.",
"💖 I'm proud to call you mine.",
"✨ My life became better the day you entered it.",
"💞 You are the peace in my heart.",
"💎 You are the most special woman in my life.",
"🌸 Your laughter is my favorite sound.",
"❤️ Your love gives me strength every day.",
"🌹 I thank God for bringing you into my life.",
"💖 My queen, today is your day.",
"💓 You are truly one of a kind.",
"✨ I promise to always respect and protect your heart.",
"💞 I promise to keep loving you more every day.",
"🌅 I promise to always stand beside you.",
"🌸 My world feels complete with you.",
"💎 I can't imagine life without you.",
"💖 You are my happiness.",
"❤️ You are my peace.",
"🌹 You are my forever.",
"💓 Tonight I just want to hold you close.",
"✨ And celebrate this beautiful woman that you are.",
"💞 But don't forget your king later tonight 😏",
"🌸 After all this love… I might need a special reward 😄",
"💖 Maybe some extra kisses for me tonight.",
"🌹 And maybe a little romantic surprise from you.",
"💓 Because loving you makes me want you even more.",
"✨ Happy Women's Day my love.",
"💞 I love you more than words can say.",
"❤️ Forever yours."
];
function checkPassword(){
    if(document.getElementById("password").value === "SajdaLove2026"){
        document.getElementById("login").style.display="none";
        startCountdown();
    } else {
        alert("Wrong password ❤️");
    }
}

function startCountdown(){
    var count = 5;
    var cd = document.getElementById("countdown");
    cd.style.display="block";
    cd.innerHTML = count;

    var interval = setInterval(function(){
        count--;
        cd.innerHTML = count;

        if(count <= 0){
            clearInterval(interval);
            cd.style.display="none";
            showSurprise();
        }
    },1000);
}

function showSurprise(){
    document.getElementById("surprise").style.display="block";
    document.getElementById("music").play();
    startSlideshow();
    createHearts();
}

function startSlideshow(){
    var img = document.getElementById("slideshow");

    changeImage();

    setInterval(function(){
        img.style.opacity = 0;

        setTimeout(function(){
            changeImage();
            img.style.opacity = 1;
        },1500);

    },5000);
}

function changeImage(){
    if(currentIndex >= images.length){
        shuffle(images);
        currentIndex = 0;
    }

    var img = document.getElementById("slideshow");
    var imageNumber = images[currentIndex];
    img.src = imageNumber + ".jpg";
    showMessage(currentIndex);
    currentIndex++;
}

function showMessage(index){
    var messageBox = document.getElementById("loveMessage");
    messageBox.innerHTML = messages[index % messages.length];
    messageBox.style.animation = "none";
    void messageBox.offsetWidth;
    messageBox.style.animation = "floatText 4s ease-in-out";
}

function createHearts(){
    setInterval(function(){
        var heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random()*100 + "vw";
        heart.style.fontSize = (Math.random()*20 + 20) + "px";
        document.body.appendChild(heart);

        setTimeout(function(){
            heart.remove();
        },8000);
    },400);
}

</script>

</body>
</html>
